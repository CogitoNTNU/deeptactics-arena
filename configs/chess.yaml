network:
  encoder_type: cnn
  input_shape: [8, 8, 111]
  hidden_shape: 128
  legal_actions: 4672
  num_layers: 4
  stem:
    num_residual_blocks: 1
    block_size: 128
  head:
    hidden_blocks: 4
train:
  learning_rate: 0.001
  batch_size: 32
  num_epochs: 10
  num_episodes: 200
  min_replay_size: 16
  max_replay_size: 200_000
  num_batches: 16
  T_0 : 1000
mcts:
  cpuct: 2
  pi_temp: 1.5
  dirichlet_alpha: 0.03
  epsilon: 0.25

env_name: chess