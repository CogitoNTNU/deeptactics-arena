network:
  encoder_type: cnn
  input_shape: [3, 3, 2]
  hidden_shape: 128
  legal_actions: 9
  num_layers: 1
  stem:
    num_residual_blocks: 1
    block_size: 128
  head:
    hidden_blocks: 1
train:
  learning_rate: 0.001
  batch_size: 32
  num_epochs: 10
  num_episodes: 200
  min_replay_size: 16
  max_replay_size: 200
  num_batches: 10
mcts:
  cpuct: 10
  pi_temp: 1.5
  epsilon: 0.25

env_name: tic_tac_toe