network:
  encoder_type: cnn
  input_shape: [3, 3, 2]
  hidden_shape: 128
  legal_actions: 9
  num_layers: 1
  stem:
    num_residual_blocks: 1
    block_size: 128
  head:
    hidden_blocks: 1
train:
  learning_rate: 0.002
  batch_size: 32
  num_epochs: 10
  num_episodes: 1000
  min_replay_size: 200
  max_replay_size: 5_000
  num_batches: 10
  num_parallel_games: 4
mcts:
  cpuct: 4.0
  pi_temp: 1.0
  exploration_moves: 4
  epsilon: 0.25
  num_simulations: 200
  dirichlet_alpha: 0.3

env_name: tic_tac_toe